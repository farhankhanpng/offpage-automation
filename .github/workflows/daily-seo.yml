name: IA Spaces - Daily Off-Page SEO Pipeline

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time) every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily SEO Pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python run_daily.py

      - name: Commit & Push Daily Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/sheets_offline_cache/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Daily SEO Report [skip ci]"
          git push || echo "No changes to commit or push."
