name: IA Spaces - Daily Off-Page SEO Pipeline

on:
  schedule:
    # 03:30 UTC = 09:00 IST every day
    - cron: '30 3 * * *'
  workflow_dispatch:

# Daily and weekly runs share one queue, so they never push at the same time.
concurrency:
  group: offpage-seo-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit reports and the cache back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run daily pipeline
        id: pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          REQUIRE_SHEETS: "true"   # fail the run (and email the owner) if Sheets can't be reached
        run: python run_daily.py

      - name: Commit and push report and cache
        # Runs even if the pipeline failed, so the report showing the failure is saved.
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/sheets_offline_cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated daily SEO report [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # The cache CSVs are rebuilt from the Google Sheet on every run, so if another run
            # changed them too, keep this run's copy ("-X theirs" = this commit during a rebase).
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort || true
            fi
            echo "Push attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::Could not push the daily report after 3 attempts"
          exit 1
