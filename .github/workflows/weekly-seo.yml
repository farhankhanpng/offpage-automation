name: IA Spaces - Weekly Off-Page SEO & Citation Pipeline

on:
  schedule:
    # 04:00 UTC = 09:30 IST every Monday (30 minutes after the daily run)
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Shares the queue with the daily run, so the two never push at the same time.
concurrency:
  group: offpage-seo-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run weekly pipeline
        id: pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          REQUIRE_SHEETS: "true"
        run: python run_weekly.py

      - name: Commit and push report and cache
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/sheets_offline_cache/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated weekly SEO report [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::Could not push the weekly report after 3 attempts"
          exit 1
