# IA Spaces Off-Page SEO Automation Settings
# Values here can be overridden from .env or the environment (see .env.example).
app:
  name: "IA Spaces Off-Page SEO Engine"
  version: "1.5.2"
  target_brand: "IA Spaces"
  target_website: "https://iaspaces.co"
  parent_brand: "India Accelerator"
  parent_website: "https://www.indiaaccelerator.co"
  market: "India"

# Company facts used in outreach drafts. Update these (and the "checked" note)
# whenever the website changes. Never add a figure without a public source.
brand_facts:
  hubs: "40+"
  cities: "25+"
  parent: "India Accelerator"
  website: "https://iaspaces.co"
  phone: "+91 80313 22007"
  spokesperson: "Ashish Bhatia"
  spokesperson_title: "Founder & CEO, India Accelerator"
  checked: "2026-11-25: iaspaces.co homepage says 40+ hubs and 25+ cities; sitemap.xml lists 40 hub pages in 25 cities (all in data/ia-spaces-nap-master.csv)"

crawler:
  # An honest bot user agent with a contact. Robots.txt rules are checked for this agent.
  user_agent: "IASpacesSEOBot/1.1 (+https://iaspaces.co; info@iaspaces.co)"
  timeout_seconds: 15
  request_delay_seconds: 3.0
  max_retries: 2
  respect_robots_txt: true

sheets:
  service_account_path: "secrets/google-service-account.json"
  sheet_name: "IA Spaces - Off-Page SEO Master"
  # Optional but recommended: the long ID from the Sheet's URL
  # (docs.google.com/spreadsheets/d/<THIS PART>/edit). With it, the Drive scope is not needed.
  sheet_id: ""
  # GitHub Actions sets REQUIRE_SHEETS=true so a broken Sheets connection fails the run.
  require_connection: false
  retention_days: 90
  tombstones_file: "data/purged_ids.txt"

outreach:
  # Minimum score for a draft. Drafts are only created for pages that were fetched.
  min_score: 65
  # Who signs the drafts.
  # Signature: name, title, then Mobile, Email and Website lines.
  sender:
    name: "Ishmeet Khanna"
    title: "Marketing Manager"
    email: "ishmeet.khanna@indiaaccelerator.co"
    phone: "+91 96431 49801"

discovery:
  public_rss_feeds:
    - "https://inc42.com/feed/"
    - "https://yourstory.com/feed"
    - "https://entrackr.com/feed/"
    - "https://www.livemint.com/rss/companies"
  gdelt_queries:
    - "coworking India"
    - "managed office India"
    - "flexible workspace India"
    - "\"India Accelerator\""

backlinks:
  # Pages that should link to iaspaces.co but may still point at these legacy URLs.
  legacy_targets:
    - "indiaaccelerator.co/ia-spaces"
    - "indiaaccelerator.co/coworking"
    - "indiaaccelerator.co/spaces"

paths:
  master_nap_csv: "data/ia-spaces-nap-master.csv"
  data_dir: "data"
  logs_dir: "logs"
  reports_dir: "reports"
  secrets_dir: "secrets"
